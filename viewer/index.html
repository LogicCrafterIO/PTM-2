        (extraCells || "") +
        `<td>${esc(r.surprise_cell || "—").replace(/\*\*/g, "")}</td>` +
        `<td>${esc(r.guidance_valuation_cell || "—")}</td>` +
        `<td>${esc(r.setup_cell || "—")}</td>` +
        `<td><span class="${sideCls}"><strong>${esc(r.side || "")}</strong></span></td>` +
        `<td><strong>${esc(r.label || "")}</strong><div style="font-size:11px;color:var(--muted)">conviction ${esc(r.conviction || "?")}</div></td>` +
        `</tr>`;
    }

    // The best long and the best short are separate calls with separate
    // reasoning, and the short leads wherever the industry is not rising —
    // rendered in the order the server decided (short_first), not styled after
    // the fact, so the page and the markdown always agree.
    function setupsPickCard(pick, side, primary) {
      const label = side === "short" ? "Best short" : "Best long";
      const cls = side === "short" ? "neg" : "pos";
      const rank = primary ? "primary call" : "secondary call";
      if (!pick) {
        return `<div style="flex:1 1 320px;min-width:280px"><div><strong class="${cls}">${label}</strong> ` +
          `<span class="muted" style="font-size:11px">${rank}</span></div>` +
          `<p class="muted" style="margin:4px 0 0;font-size:12px">the pass named none</p></div>`;
      }
      if (!pick.ticker) {
        return `<div style="flex:1 1 320px;min-width:280px"><div><strong class="${cls}">${label}</strong> ` +
          `<span class="muted" style="font-size:11px">${rank}</span></div>` +
          `<p style="margin:4px 0 0;font-size:12px"><strong>None in this industry.</strong> ` +
          `${esc(pick.none_reason || "")}</p></div>`;
      }
      const warn = pick.against_revisions
        ? ` <span class="neg" title="this side opposes the direction of the name's own FY1 revisions (${esc(pick.revision_prior || "")} prior)">⚠</span>`
        : "";
      const field = (name, value) => value
        ? `<div style="font-size:12px;margin-top:3px"><strong>${name}</strong> ${esc(value)}</div>` : "";
      const measured = (name, value) => value
        ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">${name}: ${esc(value)}</div>` : "";
      return `<div style="flex:1 1 320px;min-width:280px;padding-left:8px;border-left:3px solid ${side === "short" ? "var(--short)" : "var(--long)"}">` +
        `<div><strong class="${cls}">${label}</strong> <span class="muted" style="font-size:11px">${rank}</span></div>` +
        `<div style="margin-top:2px"><strong>${esc(pick.ticker)}</strong>${warn}` +
        (pick.name ? ` <span class="muted">${esc(pick.name)}</span>` : "") +
        (pick.conviction ? ` <span class="muted" style="font-size:11px">conviction ${esc(pick.conviction)}</span>` : "") +
        `</div>` +
        field("Thesis:", pick.thesis) +
        field("The catalyst:", pick.catalyst) +
        field("Setup:", pick.setup) +
        field("Risk:", pick.risk) +
        measured("Latest earnings surprise", pick.surprise_cell) +
        measured("Print setup", pick.setup_cell) +
        measured("Valuation vs industry", pick.valuation_cell) +
        `</div>`;
    }

    function setupsPickRow(g) {
      if (!g.llm_used) return "";
      const order = g.short_first
        ? [["short", g.best_short], ["long", g.best_long]]
        : [["long", g.best_long], ["short", g.best_short]];
      const cards = order.map(([side, pick], i) => setupsPickCard(pick, side, i === 0)).join("");
      return `<div style="display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 4px">${cards}</div>` +
        (g.short_first
          ? `<p class="muted" style="margin:2px 0 0;font-size:11px">Estimate breadth is flat or negative here, so the short is the primary call and the tactical line leads with it.</p>`
          : "");
    }

    function renderSetupsLeaderboard(host, ranking) {
      if (!host) return;
      if (!ranking || ranking.error || !(ranking.groups || []).length) {
        host.innerHTML = `<div class="setups-panel"><h3>Best setups into the next print</h3>` +
          `<p class="muted" style="margin:4px 0 0">${esc((ranking && ranking.error) || "no ranking yet — run the radar, refresh fundamentals, then Rank industries")}</p></div>`;
        return;
      }
      const board = ranking.leaderboard || {};
      const byTicker = {};
      for (const g of ranking.groups || []) {
        for (const r of g.ranking || []) byTicker[r.ticker] = { ...r, theme: g.theme };
      }
      const section = (title, rows, cls) => {
        if (!rows || !rows.length) {
          return `<p style="margin:8px 0 2px"><strong>${title}</strong> <span class="muted">— none</span></p>`;
        }
        return `<p style="margin:10px 0 4px"><strong class="${cls}">${title}</strong> ` +
          `<span class="muted" style="font-size:12px">${rows.length} ranked across industries</span></p>` +
          `<div class="setups-scroll" style="max-height:none"><table style="width:100%">` +
          `<thead><tr>${["#", "Ticker", "Industry", "Latest earnings surprise", "Guidance / valuation", "Print setup", "Side", "Why it ranks here"]
            .map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
          rows.map((row) => {
            const src = byTicker[row.ticker] || {};
            const themeCell = `<td><span class="linklike" data-report="${esc(setupsSlug(row.theme) + "/_RANKING_" + (ranking.as_of || "") + ".md")}" style="cursor:pointer" title="open this industry's full ranking">${esc(row.theme || "")}</span></td>`;
            return setupsRow({ ...src, rank: row.rank, label: row.why || src.label }, themeCell);
          }).join("") +
          `</tbody></table></div>`;
      };
      host.innerHTML = `<div class="setups-panel">` +
        `<h3>Best setups into the next print — ${esc(ranking.as_of || "")}</h3>` +
        `<p class="muted" style="margin:2px 0 6px">Cross-industry final over each industry's best long and best short` +
        (board.model ? ` · model ${esc(board.model)}` : "") +
        `. Latest earnings surprise, print setup and the multiples are computed from the cached data — the model supplies the guidance read, the ordering and the reasoning. No technicals, no price action. Commentary, not a gate.</p>` +
        (board.summary ? `<p style="margin:4px 0 2px">${esc(board.summary)}</p>` : "") +
        section("Best longs", board.longs, "pos") +
        section("Best shorts", board.shorts, "neg") +
        `</div>`;
      host.querySelectorAll("[data-report]").forEach((node) => {
        node.addEventListener("click", () => openSetupsReport(node.dataset.report || ""));
      });
    }

    function renderSetupsGroups(host, ranking) {
      if (!host) return;
      const groups = (ranking && ranking.groups) || [];
      if (!groups.length) { host.innerHTML = ""; return; }
      let body = "";
      for (const g of groups) {
        const rows = g.ranking || [];
        const rel = setupsSlug(g.theme) + "/_RANKING_" + (ranking.as_of || "") + ".md";
        body += `<div class="setups-panel">` +
          `<h3><span class="linklike" data-report="${esc(rel)}" style="cursor:pointer" title="open the full ranking markdown">${esc(g.theme)}</span></h3>` +
          `<p class="muted" style="margin:0 0 6px;font-size:12px">${esc(g.status || "n/a")}, lean ${esc(g.lean || "?")} ` +
          `(breadth ${(g.breadth >= 0 ? "+" : "") + Number(g.breadth || 0).toFixed(2)}) · ${g.members_ranked || 0} ranked` +
          ((g.members_skipped || []).length ? ` · no fundamental data, skipped: ${esc(g.members_skipped.join(", "))}` : "") +
          (g.web_queries ? ` · ${esc(g.web_queries)} web quer${g.web_queries === 1 ? "y" : "ies"}` : "") +
          (g.llm_used ? "" : ` · <span class="neg">unranked (no LLM pass) — measured columns only</span>`) +
          `</p>` +
          (g.headline ? `<p style="margin:4px 0 8px">${esc(g.headline)}</p>` : "") +
          setupsPickRow(g) +
          (g.tactical ? `<p style="margin:8px 0 4px"><strong>Tactical trade idea:</strong> ${esc(g.tactical)}</p>` : "") +
          (rows.length
            ? `<div class="setups-scroll" style="max-height:none"><table style="width:100%">` +
              `<thead><tr>${["#", "Ticker", "Latest earnings surprise", "Guidance / valuation", "Print setup", "Side", "Risk/reward ranking"]
                .map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
              rows.map((r) => setupsRow(r, "")).join("") +
              `</tbody></table></div>`
            : `<p class="muted" style="margin:4px 0 0">no members with fundamental data to rank</p>`) +
          (rows.some((r) => r.catalyst || r.setup || r.risk)
            ? `<details style="margin-top:8px"><summary class="muted">The case for each name, in order</summary>` +
              rows.map((r) => {
                if (!(r.catalyst || r.setup || r.risk)) return "";
                const warn = r.against_revisions
                  ? ` · <span class="neg">⚠ against its own revisions (${esc(r.revision_prior || "")} prior)</span>` : "";
                return `<div style="margin:8px 0 0;padding-left:8px;border-left:2px solid var(--border)">` +
                  `<div><strong>${esc(r.rank)}. ${esc(r.ticker)}</strong>` +
                  (r.name ? ` <span class="muted">${esc(r.name)}</span>` : "") +
                  (r.label ? ` — ${esc(r.label)}` : "") +
                  ` · <span class="${r.side === "long" ? "pos" : r.side === "short" ? "neg" : "muted"}">${esc(r.side || "")}</span>` +
                  ` · conviction ${esc(r.conviction || "?")}${warn}</div>` +
                  (r.catalyst ? `<div style="font-size:12px;margin-top:2px"><strong>The catalyst:</strong> ${esc(r.catalyst)}</div>` : "") +
                  (r.setup ? `<div style="font-size:12px;margin-top:2px"><strong>Setup:</strong> ${esc(r.setup)}</div>` : "") +
                  (r.risk ? `<div style="font-size:12px;margin-top:2px"><strong>Risk:</strong> ${esc(r.risk)}</div>` : "") +
                  (r.ranked_on ? `<div style="font-size:12px;margin-top:2px" title="the fundamental fact the pass had to name as the reason for this rank — never a multiple"><strong>Ranked on:</strong> ${esc(r.ranked_on)}</div>` : "") +
                  (r.reports_quarter ? `<div class="muted" style="font-size:11px;margin-top:2px">next print reports ${esc(r.reports_quarter)}</div>` : "") +
                  `</div>`;
              }).join("") +
              `</details>`
            : "") +
          `</div>`;
      }
      host.innerHTML = `<div class="setups-panel"><h3>Per-industry rankings — ${groups.length} industry group(s)</h3>` +
        `<p class="muted" style="margin:4px 0 0">One pass per industry over all of its members at once, giving the <strong>best long</strong> and the <strong>best short</strong> each its own thesis, catalyst, setup and risk — two trades, not one narrative. Where an industry's estimate breadth is flat or negative the short leads, since the useful answer there is which member's expectations get cut. The side is the pass's own call, not the revision rule's: ⚠ marks a name whose side opposes the direction of its own FY1 revisions, and its risk has to say why. Click an industry to open the full ranking markdown.</p></div>` + body;
      host.querySelectorAll("[data-report]").forEach((node) => {
        node.addEventListener("click", () => openSetupsReport(node.dataset.report || ""));
      });
    }

    async function loadSetupsData() {
      const el = document.getElementById("tab-setups");
      if (!el.querySelector("#setups-arts")) return;
      const status = await (await fetch("/api/setups/status")).json().catch(() => ({}));
      renderSetupsArtifacts(el.querySelector("#setups-arts"), status.artifacts || {});
      const [ranking, reports] = await Promise.all([
        fetch("/api/setups/ranking").then((r) => r.json()).catch(() => null),
        fetch("/api/setups/reports").then((r) => r.json()).catch(() => null),
      ]);
      const payload = ranking && (ranking.ranking || ranking);
      renderSetupsLeaderboard(el.querySelector("#setups-board-host"), payload);
      renderSetupsGroups(el.querySelector("#setups-groups-host"), payload && payload.groups ? payload : null);

      const repHost = el.querySelector("#setups-reports-host");
      const list = (reports && reports.reports) || [];
      const label = (p) => {
        const parts = p.split(/[\\/]/);
        const base = (parts[parts.length - 1] || "").replace(/\.md$/, "");
        const stamp = base.replace(/^_?(RANKING|LEADERBOARD)_/, "");
        const kind = base.startsWith("_LEADERBOARD") ? "LEADERBOARD" : "ranking";
        return parts.length > 1 ? `${parts[0]} · ${stamp}` : `${kind} ${stamp}`;
      };
      repHost.innerHTML = `<div class="dd-batch"><strong>Ranking files (${list.length})</strong>` +
        (list.length
          ? `<div style="margin-top:6px"><select id="setups-rep-select" style="min-width:360px;max-width:100%">` +
            `<option value="">— pick a ranking —</option>` +
            list.map((r) => `<option value="${esc(r.path)}">${esc(label(r.path))}</option>`).join("") +
            `</select> <button id="setups-rep-open" style="font-size:12px">Open</button></div>`
          : `<p class="muted" style="margin:4px 0 0">no rankings yet</p>`) +
        `</div>`;
      const sel = repHost.querySelector("#setups-rep-select");
      const openBtn = repHost.querySelector("#setups-rep-open");
      if (sel) {
        sel.addEventListener("change", () => openSetupsReport(sel.value));
        if (openBtn) openBtn.addEventListener("click", () => openSetupsReport(sel.value));
      }
    }

    async function openSetupsReport(rel) {
      if (!rel) return;
      showHtml(`<p class="muted">Loading ${esc(rel)}…</p>`);
      try {
        const res = await fetch("/api/setups/report/" + encodeURIComponent(rel));
        const payload = await res.json();
        showHtml(payload.error
          ? `<p class="err">${esc(payload.error)}</p>`
          : `<h2>${esc(payload.path)}</h2><div class="dd-report">${mdToHtml(payload.markdown || "")}</div>`);
      } catch (e) {
        showHtml(`<p class="err">${esc(String(e.message || e))}</p>`);
      }
    }

    async function loadDeepDiveInline(ticker, host) {
      host.innerHTML = `<p class="muted">Loading deep dive for ${esc(ticker)}…</p>`;
      try {
        const res = await fetch(`/ideas/deepdive/${encodeURIComponent(ticker)}/REPORT.md`);
        if (!res.ok) { host.innerHTML = `<p class="err">No REPORT.md cached for ${esc(ticker)}.</p>`; return; }
        host.innerHTML = mdToHtml(await res.text());
      } catch (e) {
        host.innerHTML = `<p class="err">${esc(String(e.message || e))}</p>`;
      }
    }

    function renderAudit() {
      const el = document.getElementById("tab-audit");
      const err = fileErr(state.audit, "audit.json");
      if (err) { el.innerHTML = `<p class="err">${esc(err)}</p>`; return; }
      const a = state.audit;
      const all = a.findings || [];
      const stages = unique(all.map((f) => f.stage));
      const sevs = unique(all.map((f) => f.severity));
      el.innerHTML = `
        <div class="kpis">
          <div class="kpi"><div class="lbl">As of</div><div class="val" style="font-size:13px">${esc(asOf(a.as_of))}</div></div>
          ${Object.entries(a.by_severity || {}).map(([k, v]) => `<div class="kpi"><div class="lbl">${esc(k)}</div><div class="val">${esc(v)}</div></div>`).join("")}
          ${Object.entries(a.by_stage || {}).map(([k, v]) => `<div class="kpi"><div class="lbl">${esc(k)}</div><div class="val">${esc(v)}</div></div>`).join("")}
        </div>
        <p class="hint">${esc(a.summary || "")}</p>
        <div class="filters">
          <input id="q" placeholder="Ticker, check, suggestion…">
          <select id="f-sev"><option value="">All severities</option>${sevs.map((s) => `<option>${esc(s)}</option>`).join("")}</select>
          <select id="f-stage"><option value="">All stages</option>${stages.map((s) => `<option>${esc(s)}</option>`).join("")}</select>
          <span class="muted" id="row-count"></span>
        </div>
        <div id="audit-table"></div>
      `;
      const cols = [
        { key: "ticker", label: "Ticker", fmt: (v) => `<strong>${esc(v)}</strong>` },
        { key: "stage", label: "Stage" },
        { key: "severity", label: "Severity", fmt: (v) => `<span class="badge ${sevClass(v)}">${esc(v)}</span>` },
        { key: "check_id", label: "Check", fmt: (v) => `<span class="badge">${esc(v)}</span>` },
        { key: "suggestion", label: "Suggestion", wrap: true },
      ];
      const draw = () => {
        const q = (el.querySelector("#q").value || "").toLowerCase();
        const sev = el.querySelector("#f-sev").value;
        const stage = el.querySelector("#f-stage").value;
        const rows = all.filter((r) => {
          if (sev && r.severity !== sev) return false;
          if (stage && r.stage !== stage) return false;
          if (!q) return true;
          return `${r.ticker} ${r.check_id} ${r.suggestion || ""} ${r.evidence || ""}`.toLowerCase().includes(q);
        });
        el.querySelector("#row-count").textContent = `${rows.length} shown`;
        attachTable(el.querySelector("#audit-table"), rows, cols, {
          tableId: "tbl-audit",
          rowId: (r, i) => `${r.ticker}|${r.check_id}|${i}`,
          onSelect: (r) => showHtml(`
            <h2>${esc(r.ticker)} · ${esc(r.check_id)}</h2>
            <p><span class="badge ${sevClass(r.severity)}">${esc(r.severity)}</span> ${esc(r.stage)}</p>
            ${r.evidence ? `<pre>${esc(r.evidence)}</pre>` : ""}
            <p>${esc(r.suggestion || "")}</p>
          `),
        });
      };
      bindFilters(el, ["q", "f-sev", "f-stage"], draw);
      draw();
    }

    async function ensure(tab) {
      const el = document.getElementById("tab-" + tab);
      if (tab === "ideas" && !state.ideas) {
        el.innerHTML = `<p class="muted">Loading ideas.json…</p>`;
        state.ideas = await loadOr("ideas.json");
        renderIdeas();
      } else if (tab === "screen" && (state.ranking == null || state.candidates == null)) {
        el.innerHTML = `<p class="muted">Loading ranking.json and candidates.json…</p>`;
        const [ranking, candidates] = await Promise.all([loadOr("ranking.json"), loadOr("candidates.json")]);
        state.ranking = ranking;
        state.candidates = candidates;
        renderScreen();
      } else if (tab === "momentum" && state.momentum == null) {
        el.innerHTML = `<p class="muted">Loading momentum.json…</p>`;
        state.momentum = await loadOr("momentum.json");
        renderMomentum();
      } else if (tab === "groups" && (state.groups == null || state.ideas == null)) {
        el.innerHTML = `<p class="muted">Loading group_reviews.json…</p>`;
        const [groups, ideas] = await Promise.all([
          state.groups == null ? loadOr("group_reviews.json") : Promise.resolve(state.groups),
          state.ideas == null ? loadOr("ideas.json") : Promise.resolve(state.ideas),
        ]);
        state.groups = groups;
        state.ideas = ideas;
        state.qualMap = null; // rebuild the ticker->qual map for the fresh ideas
        renderGroups();
      } else if (tab === "macro" && (state.macro == null || state.fred == null)) {
        el.innerHTML = `<p class="muted">Loading macro snapshot…</p>`;
        const [macro, fred] = await Promise.all([loadOr("macro_snapshot.json"), loadOr("macro_fred.json")]);
        state.macro = macro;
        state.fred = fred;
        renderMacro();
      } else if (tab === "themes" && (state.themeCohorts == null || state.themeIsm == null || state.themeHistory == null)) {
        el.innerHTML = `<p class="muted">Loading theme files…</p>`;
        const [c, i, h] = await Promise.all([
          loadOr("theme_cohorts.json"),
          loadOr("theme_ism_alignment.json"),
          loadOr("theme_history.json"),
        ]);
        state.themeCohorts = c;
        state.themeIsm = i;
        state.themeHistory = h;
        renderThemes();
      } else if (tab === "deepdives" && !state.deepdivesLoaded) {
        el.innerHTML = `<p class="muted">Loading cached dives…</p>`;
        await loadDeepDives();
      } else if (tab === "pipeline" && !state.pipelineLoaded) {
        el.innerHTML = `<p class="muted">Loading pipeline status…</p>`;
        await loadPipeline();
      } else if (tab === "simple" && !state.simpleLoaded) {
        el.innerHTML = `<p class="muted">Loading simple-process state…</p>`;
        await loadSimple();
      } else if (tab === "setups" && !state.setupsLoaded) {
        el.innerHTML = `<p class="muted">Loading ranking state…</p>`;
        await loadSetups();
      } else if (tab === "audit" && state.audit == null) {
        el.innerHTML = `<p class="muted">Loading audit.json…</p>`;
        state.audit = await loadOr("audit.json");
        renderAudit();
      }
    }

    document.querySelectorAll("nav button").forEach((btn) => {
      btn.addEventListener("click", async () => {
        document.querySelectorAll("nav button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const tab = btn.dataset.tab;
        document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
        document.getElementById("tab-" + tab).classList.add("active");
        document.getElementById("detail").hidden = true;
        await ensure(tab);
      });
    });

    // ---- Export PDF -------------------------------------------------------
    // Prints exactly one target: the open detail pane if there is one (an idea
    // pack, a group review, a dive report), otherwise the active nav panel.
    // The print stylesheet (above) swaps to a light theme, expands every
    // scrolled container, and hides chrome. Pure frontend: window.print() and
    // the browser's "Save as PDF" destination do the rest.
    const exportBtn = document.getElementById("export-pdf");
    let prevTitle = document.title;
    document.addEventListener("afterprint", () => {
      document.body.classList.remove("print-detail", "print-panel");
      document.title = prevTitle;
      exportBtn.disabled = false;
    });
    exportBtn.addEventListener("click", () => {
      const detail = document.getElementById("detail");
      const isDetail = !detail.hidden;
      const label = isDetail
        ? (detail.querySelector("h2")?.textContent || "detail").trim()
        : document.querySelector("nav button.active")?.textContent.trim() || "page";
      prevTitle = document.title;
      // Browsers use document.title as the suggested PDF filename.
      document.title = `PTM — ${label}`;
      document.body.classList.remove("print-panel", "print-detail");
      document.body.classList.add(isDetail ? "print-detail" : "print-panel");
      exportBtn.disabled = true;
      window.print();
      // afterprint handles restore for the print dialog; the timeout covers
      // browsers that fire print() without the dialog (Ctrl+P already open).
      setTimeout(() => {
        document.body.classList.remove("print-detail", "print-panel");
        document.title = prevTitle;
        exportBtn.disabled = false;
      }, 1500);
    });

    (async function init() {
      const status = document.getElementById("status");
      const [book, windows, b00, b31, b61, ism] = await Promise.all([
        loadOr("book.json"),
        loadOr("books_by_window.json"),
        loadOr("book_00-30d.json"),
        loadOr("book_31-60d.json"),
        loadOr("book_61-90d.json"),
        loadOr("ism.json"),
      ]);
      const failed = [book, windows, b00, b31, b61, ism].filter((x) => x && x.__error);
      if (book.__error && windows.__error && ism.__error) {
        status.textContent = "failed";
        document.getElementById("tab-book").innerHTML = `<p class="err">${esc(book.__error)}<br>From the repo root run <code>.\\.venv\\Scripts\\python.exe -m http.server 8765</code> then open <code>http://localhost:8765/viewer/</code>. Double-clicking this file will not work.</p>`;
        return;
      }
      state.book = book.__error ? null : book;
      state.windows = windows.__error ? null : windows;
      state.windowBooks = {
        "00-30d": b00.__error ? null : b00,
        "31-60d": b31.__error ? null : b31,
        "61-90d": b61.__error ? null : b61,
      };
      state.ism = ism.__error ? null : ism;
      status.textContent = state.book ? asOf(state.book.as_of) : (failed[0] ? failed[0].__error : "ready");
      renderBook();
      renderWindows();
      renderIsm();
      document.getElementById("tab-ideas").innerHTML = `<p class="hint">Open the Ideas tab to load ideas.json (large; fetched on demand).</p>`;
      ["screen", "momentum", "groups", "macro", "themes", "audit", "deepdives", "pipeline", "simple"].forEach((id) => {
        document.getElementById("tab-" + id).innerHTML = `<p class="hint">Open this tab to load the data on demand.</p>`;
      });
    })();
  </script>
</body>
