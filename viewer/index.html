          });
        });
      };
      bindFilters(el, ["dd-q", "dd-f-side", "dd-f-sector", "dd-f-window", "dd-f-score", "dd-sort"], draw);
      // Side filter is shared with the Ideas tab: seeded from it, and any
      // change here flows back so both tabs filter the same side.
      el.querySelector("#dd-f-side").value = state.sharedSide || "";
      draw();
      const goBtn = el.querySelector("#dd-go");
      if (goBtn) goBtn.addEventListener("click", startBatch);
      if (state.deepdives && state.deepdives.length) {
        const first = el.querySelector("#dd-list .card");
        if (first) {
          first.classList.add("selected");
          openReport(first.dataset.ticker);
        }
      }
    }

    async function startBatch() {
      const el = document.getElementById("tab-deepdives");
      const text = el.querySelector("#dd-tickers").value || "";
      const force = el.querySelector("#dd-force") && el.querySelector("#dd-force").checked;
      const tickers = text.split(/[\s,;]+/).map((t) => t.trim().toUpperCase()).filter(Boolean);
      if (!tickers.length) { el.querySelector("#dd-progress").textContent = "Enter at least one ticker."; return; }
      const go = el.querySelector("#dd-go");
      go.disabled = true;
      try {
        const res = await fetch("/api/deepdive/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tickers, force }),
        });
        const payload = await res.json();
        if (!res.ok) {
          el.querySelector("#dd-progress").innerHTML = `<span class="neg">${esc(payload.error || "failed to start")}</span>`;
          go.disabled = false;
          return;
        }
        pollBatch();
      } catch (e) {
        el.querySelector("#dd-progress").innerHTML = `<span class="neg">${esc(String(e.message || e))}</span>`;
        go.disabled = false;
      }
    }

    // Live deep-dive progress: stepper, current-stage detail, timers, log.
    const DD_STAGES = ["startup", "filings", "macro", "research", "search", "fetch", "extract", "macro-impact", "drivers", "cases", "debate", "synthesis", "catalysts", "done"];
    const STAGE_LABEL = {
      startup: "startup",
      filings: "SEC filings",
      macro: "macro dashboard",
      research: "planning",
      search: "web search",
      fetch: "fetch pages",
      extract: "extract findings",
      "macro-impact": "macro impact",
      drivers: "drivers",
      cases: "bull/bear cases",
      debate: "debate",
      synthesis: "synthesis",
      catalysts: "catalysts",
      done: "done",
      fail: "failed",
      failed: "failed",
      queued: "queued",
    };
    const stageLabel = (s) => esc(STAGE_LABEL[s] || s || "");

    // Server events are numbered; we render any with an index >= this.
    let ddLogCount = 0;

    function fmtElapsed(iso) {
      if (!iso) return "";
      const then = new Date(iso).getTime();
      if (Number.isNaN(then)) return "";
      const s = Math.max(0, Math.floor((Date.now() - then) / 1000));
      const m = Math.floor(s / 60);
      return m > 0 ? `${m}m${String(s % 60).padStart(2, "0")}s` : `${s}s`;
    }

    function renderStepper(currentStage) {
      // search/fetch/extract all live inside the research stage; the stepper
      // marks their leaf position so the pill shows where inside it we are.
      const idx = DD_STAGES.indexOf(currentStage);
      return DD_STAGES.map((s, i) => {
        const cls = idx < 0 ? "" : i < idx ? "done" : i === idx ? "active" : "";
        return `<span class="dd-step ${cls}">${stageLabel(s)}</span>`;
      }).join("");
    }

    async function pollBatch() {
      const el = document.getElementById("tab-deepdives");
      try {
        const res = await fetch("/api/deepdive/status");
        const st = await res.json();
        const progress = el.querySelector("#dd-progress");
        const doneHost = el.querySelector("#dd-done");
        if (!progress || !doneHost) return;

        // 1. Live line: ticker, batch position, current stage + detail + timers.
        if (st.error) {
          progress.innerHTML = `<span class="neg">${esc(st.error)}</span>`;
        } else if (st.running && st.current) {
          progress.innerHTML =
            `Running <span class="cur">${esc(st.current)}</span> — ${st.done.length}/${st.queue.length} done · ` +
            `<span class="stage-detail">${stageLabel(st.stage)}</span>` +
            (st.stage_detail ? ` — ${esc(st.stage_detail)}` : "") +
            ` <span class="timer">(stage ${fmtElapsed(st.stage_since) || "…"} · total ${fmtElapsed(st.started) || "…"})</span>`;
          const stepperHost = el.querySelector("#dd-stepper");
          if (stepperHost) {
            stepperHost.style.display = "flex";
            stepperHost.innerHTML = renderStepper(st.stage);
          }
          const logHost = el.querySelector("#dd-log");
          if (logHost) logHost.style.display = "block";
        } else if (st.running) {
          progress.textContent = "Starting…";
        }

        // 2. Stage log: append any events we have not seen yet (numbered by server).
        const events = st.events || [];
        if (events.length > ddLogCount) {
          const logHost = el.querySelector("#dd-log");
          if (logHost) {
            for (let i = ddLogCount; i < events.length; i++) {
              const ev = events[i];
              const row = document.createElement("div");
              const time = ev.t ? new Date(ev.t).toTimeString().slice(0, 8) : "";
              row.className = "dd-log-row";
              row.innerHTML = `<span class="t">${time}</span> <strong>${esc(ev.ticker)}</strong> · ${stageLabel(ev.stage)}${ev.detail ? " — " + esc(ev.detail) : ""}`;
              logHost.appendChild(row);
              logHost.scrollTop = logHost.scrollHeight;
            }
          }
          ddLogCount = events.length;
        }

        // 3. Per-ticker results.
        doneHost.innerHTML = (st.done || []).map((d) =>
          `<li>${d.ok ? "<span class='pos'>✔</span>" : "<span class='neg'>✗</span>"} <strong>${esc(d.ticker)}</strong>` +
          (d.stance ? ` — <span class="stance ${esc(d.stance)}">${esc(d.stance)}</span>` : "") +
          (d.error ? ` — <span class="neg">${esc(d.error)}</span>` : "") +
          `</li>`
        ).join("") || '<p class="muted" style="margin:4px 0">No dives finished yet.</p>';

        // 4. Continue or finish.
        if (st.running) {
          setTimeout(pollBatch, 2000);
        } else {
          const go = el.querySelector("#dd-go");
          if (go) go.disabled = false;
          if ((st.done || []).length) {
            progress.innerHTML =
              `Batch complete in ${st.started ? fmtElapsed(st.started) : "?"}: ` +
              `${(st.done || []).filter((d) => d.ok).length} ok, ${(st.done || []).filter((d) => !d.ok).length} failed. Reloading list…`;
            setTimeout(async () => {
              await loadDeepDives();
            }, 1200);
          }
        }
      } catch (e) {
        setTimeout(pollBatch, 8000);
      }
    }

    // --- Pipeline tab: run the full idea pipeline (deep-dive qualitative) ---
    let pipePollTimer = null;

    // Per-ticker deep-dive progress from the server's live dive state
    // (/api/pipeline/status -> dives: {ticker: {stage, detail, since, seq}}).
    // The server folds every log line into this O(1) state, so cards stay up
    // even after the underlying log lines scroll out of the ring buffer.
    function renderPipeDiveCards(dives) {
      const host = document.querySelector("#pipe-dives");
      if (!host) return;
      const list = Object.entries(dives || {})
        .map(([ticker, d]) => ({ ticker, ...(d || {}) }))
        .sort((a, b) => (a.seq || 0) - (b.seq || 0) || a.ticker.localeCompare(b.ticker));
      if (!list.length) { host.innerHTML = ""; return; }
      host.innerHTML = list.slice(0, 12).map((d) => {
        const cached = d.stage === "cache hit" || d.stage === "cache stale";
        const stageSecs = d.since ? Date.now() - new Date(d.since).getTime() : null;
        return `
        <div class="dd-batch" style="margin-bottom:8px;padding:8px 12px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <strong style="font-variant-numeric:tabular-nums">${esc(d.ticker)}</strong>
            <span class="dd-step ${cached ? "done" : "active"}">${stageLabel(d.stage)}</span>
            ${stageSecs != null && stageSecs >= 0 ? `<span class="timer" style="font-size:11px">${fmtSecs(Math.floor(stageSecs / 1000))}</span>` : ""}
            ${d.detail ? `<span class="stage-detail" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.detail)}</span>` : ""}
          </div>
          <div class="dd-stepper" style="margin:2px 0 0">${renderStepper(d.stage)}</div>
        </div>`;
      }).join("")
      + (list.length > 12 ? `<p class="pipe-note" style="margin:2px 0 0">+ ${list.length - 12} more dives running — full detail in the log below</p>` : "");
    }

    function fmtSecs(s) {
      if (s == null) return "";
      const m = Math.floor(s / 60);
      return m > 0 ? `${m}m${String(Math.round(s % 60)).padStart(2, "0")}s` : `${Math.round(s)}s`;
    }

    function renderPipeLog(events) {
      const logHost = document.querySelector("#pipe-log");
      if (!logHost) return;
      logHost.innerHTML = (events || []).map((e) => {
        const time = e.t ? new Date(e.t).toTimeString().slice(0, 8) : "";
        return `<div><span class="t">${time}</span> ${esc((e.line || "").replace(/^\[\d{2}:\d{2}:\d{2}\]\s*/, ""))}</div>`;
      }).join("");
      logHost.scrollTop = logHost.scrollHeight;
    }

    // A done run invalidates every curated view: book, windows and ideas all
    // re-fetch from the files the run just wrote.
    function invalidateCurated() {
      state.book = null;
      state.windows = null;
      state.windowBooks = {};
      state.ideas = null;
      state.ranking = null;
      state.candidates = null;
      state.momentum = null;
      state.groups = null;
      state.macro = null;
      state.fred = null;
      state.themeCohorts = null;
      state.themeIsm = null;
      state.themeHistory = null;
      state.audit = null;
      state.ism = null;
      renderBook();
      renderWindows();
    }

    async function pollPipeline() {
      const el = document.getElementById("tab-pipeline");
      const progress = el && el.querySelector("#pipe-progress");
      if (!progress) return; // tab closed; the run continues server-side
      let st;
      try {
        const res = await fetch("/api/pipeline/status");
        st = await res.json();
      } catch (e) {
        progress.innerHTML = `<span class="neg">Could not reach the viewer API.</span>`;
        pipePollTimer = setTimeout(pollPipeline, 8000);
        return;
      }

      // Always re-arm before any early-return, so polling never stops while the tab is open.
      if (st.running) {
        pipePollTimer = setTimeout(pollPipeline, 2500);
      } else if (!st.finished && !st.result) {
        // Idle — poll slowly to stay live without hammering the server.
        pipePollTimer = setTimeout(pollPipeline, 10000);
      }

      // --- Progress: prefer the server's tracked state; fall back to log parsing ---
      const events = st.events || [];
      let ideaDone = null, ideaTotal = null, diveOk = 0, diveFail = 0;
      if (typeof st.ideas_total === "number" && st.ideas_total > 0) {
        ideaTotal = st.ideas_total;
        ideaDone = st.ideas_started || 0;
        diveOk = st.staged || 0;
        diveFail = st.failed || 0;
      } else {
        for (const ev of events) {
          const m = ev.line ? ev.line.match(/\bidea (\d+)\/(\d+) /) : null;
          if (m) { ideaDone = parseInt(m[1]); ideaTotal = parseInt(m[2]); }
          if (ev.line && /deep dive FAIL/.test(ev.line)) diveFail++;
          if (ev.line && /deep dive staged/.test(ev.line)) diveOk++;
        }
        ideaDone = ideaDone || 0;
      }
      const dives = st.dives || {};
      const activeCount = Object.keys(dives).length;
      const queued = ideaTotal != null ? Math.max(0, ideaTotal - (ideaDone || 0) - activeCount) : null;
      const pct = (ideaTotal && ideaTotal > 0)
        ? Math.round(((ideaDone || 0) / ideaTotal) * 100)
        : null;

      // --- Render the status line ---
      if (st.running) {
        const goBtn = el.querySelector("#pipe-go");
        if (goBtn) goBtn.disabled = true;
        progress.innerHTML =
          `<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">` +
          `<span>Running <strong>${esc(st.mode || "")} pipeline</strong> — qual: ${esc(st.qual_mode || "deepdive")}</span>` +
          `<span class="timer">${st.started ? new Date(st.started).toTimeString().slice(0, 8) : ""} · ${fmtSecs(st.elapsed_s)}</span>` +
          `</div>` +
          (pct != null
            ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">` +
              `<div style="flex:1;height:6px;background:var(--border);border-radius:3px">` +
                `<div style="width:${pct}%;height:100%;background:var(--accent);border-radius:3px;transition:width .4s"></div>` +
              `</div>` +
              `<span style="font-size:12px;color:var(--muted)">${ideaDone}/${ideaTotal} ideas</span>` +
              `<span style="font-size:11px;color:var(--muted)">${pct}%</span>` +
              `</div>`
            : `<div style="margin-bottom:6px">Screening / preparing dives…</div>`) +
          `<div style="font-size:12px;margin-bottom:4px">` +
            `<span class="pos">${diveOk} dives ok</span>` +
            (diveFail > 0 ? ` · <span class="neg">${diveFail} failed</span>` : "") +
            (activeCount ? ` · ${activeCount} diving now` : "") +
            (queued != null ? ` · ${queued} queued` : "") +
            `</div>`;
        renderPipeDiveCards(dives);
        renderPipeLog(events);
        return; // polling already re-armed above
      }

      // --- Not running ---
      renderPipeLog(events);
      renderPipeDiveCards({}); // clear any stale active-dive cards
      const go = el.querySelector("#pipe-go");
      if (go) go.disabled = false;
      if (st.result) {
        const r = st.result;
        progress.innerHTML =
          `<div class="pos" style="font-size:15px;font-weight:650">✔ Finished</div>` +
          `<div style="margin-top:4px">${r.funnel ? esc(r.funnel) : esc(JSON.stringify(r)).slice(0, 400)}</div>` +
          `<div style="margin-top:6px;font-size:12px;color:var(--muted)">${fmtSecs(st.elapsed_s)} elapsed · ${diveOk} dives ok${diveFail > 0 ? ", " + diveFail + " failed (deferred)" : ""}</div>`;
        if (st.error) progress.innerHTML += `<br><span class="neg">Run error: ${esc(st.error)}</span>`;
        invalidateCurated();
      } else if (st.error) {
        progress.innerHTML = `<span class="neg">✗ Failed: ${esc(st.error)}</span>`;
      } else if (st.finished) {
        progress.innerHTML = `<div>Run finished. ${fmtSecs(st.elapsed_s)} elapsed.</div><div style="margin-top:4px;font-size:12px;color:var(--muted)">${diveOk} dives ok${diveFail > 0 ? ", " + diveFail + " failed" : ""}</div>`;
        invalidateCurated();
      } else {
        progress.innerHTML = `<div style="color:var(--muted)">Idle — start a run above; progress streams below.</div>`;
      }
    }

    async function loadPipeline() {
      const el = document.getElementById("tab-pipeline");
      el.innerHTML = `
        <div class="dd-batch">
          <strong>Run the idea pipeline — deep-dive qualitative on every candidate</strong>
          <p class="hint" style="margin:6px 0 2px">
            The weekly process now replaces its EDGAR-pack qualitative pass with a full <strong>deep research dive</strong>
            per candidate (filings + planned web research, bull-vs-bear debate, source-cited stance), then builds
            <strong>book.json, the per-window books (00-30d / 31-60d / 61-90d) and the audit</strong> from the surviving
            longs and shorts, with beta swaps only if the portfolio breaches its limit.
          </p>
          <p class="pipe-note">Slow the first time: every dive takes minutes of web search + LLM. Dives cache
          (<code>DEEPSEARCH_CACHE_DAYS</code>, default 2) and the search/page caches are shared with the Deep dives tab.
          Backdated (<code>--as-of</code>) runs use the legacy EDGAR verdict, since web research is not point-in-time.</p>
          <div class="pipe-form">
            <label>Mode
              <select id="pipe-mode">
                <option value="weekly">Weekly run (ingest + screen + dives + books + audit)</option>
                <option value="ideas">Ideas only (screen + dives + books; reuses ingested data)</option>
              </select>
            </label>
            <label>Max candidates <input type="number" id="pipe-max-cand" placeholder="all" min="1"></label>
            <label title="Weekly only: rebuild the caches from the live sources">Force ingest <input type="checkbox" id="pipe-force"></label>
            <label title="Rerun every dive from scratch, ignoring dive + query caches">Ignore dive cache <input type="checkbox" id="pipe-dd-force"></label>
            <label title="Use the old one-passage EDGAR verdict instead of the deep dive">Legacy qualitative <input type="checkbox" id="pipe-legacy"></label>
          </div>
          <button id="pipe-go">Run pipeline</button>
          <div class="dd-progress" id="pipe-progress"></div>
          <div id="pipe-dives" style="margin-top:8px"></div>
          <div class="dd-log" id="pipe-log" style="display:none"></div>
        </div>`;
      el.querySelector("#pipe-go").addEventListener("click", async () => {
        const go = el.querySelector("#pipe-go");
        const body = {
          mode: el.querySelector("#pipe-mode").value,
          max_candidates: el.querySelector("#pipe-max-cand").value || null,
          force: el.querySelector("#pipe-force").checked,
          dd_force: el.querySelector("#pipe-dd-force").checked,
          legacy_qual: el.querySelector("#pipe-legacy").checked,
        };
        go.disabled = true;
        try {
          const res = await fetch("/api/pipeline/run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const payload = await res.json();
          if (!res.ok) {
            el.querySelector("#pipe-progress").innerHTML = `<span class="neg">${esc(payload.error || "failed to start")}</span>`;
            go.disabled = false;
            return;
          }
          el.querySelector("#pipe-log").style.display = "block";
        } catch (e) {
          el.querySelector("#pipe-progress").innerHTML = `<span class="neg">${esc(String(e.message || e))}</span>`;
        }
      });
      if (pipePollTimer) clearTimeout(pipePollTimer);
      pipePollTimer = setTimeout(pollPipeline, 0);
    }

    // --- Simple tab: the theme-first simple process, one step at a time ------
    // Every stage of docs/simple_idea_process.md gets a button and an output
    // pane: theme map (xlsx clusters OR deterministic Wikipedia industries),
    // the weekly radar, per-theme selection, and the theme pass (dives +
    // gates + book + idea reports). State and artifacts stream from
    // /api/simple/*, whose handlers live in ptm_simple/viewer.py.
    let simplePollTimer = null;
    let simpleWasRunning = false;

    function renderSimpleLog(events) {
      const logHost = document.querySelector("#simple-log");
      if (!logHost) return;
      logHost.innerHTML = (events || []).map((e) => {
        const time = e.t ? new Date(e.t).toTimeString().slice(0, 8) : "";
        return `<div><span class="t">${time}</span> ${esc((e.line || "").replace(/^\[\d{2}:\d{2}:\d{2}\]\s*/, ""))}</div>`;
      }).join("");
      logHost.scrollTop = logHost.scrollHeight;
    }

    function simpleStatusChip(status) {
      if (status === "ACTIVE") return `<span class="pos" style="font-weight:650">ACTIVE</span>`;
      if (status === "WARM") return `<span class="badge">WARM</span>`;
      return `<span class="muted">${esc(status || "?")}</span>`;
    }

    async function pollSimple() {
      const el = document.getElementById("tab-simple");
      const progress = el && el.querySelector("#simple-progress");
      if (!progress) return; // tab closed; the action continues server-side
      let st;
      try {
        const res = await fetch("/api/simple/status");
        st = await res.json();
      } catch (e) {
        progress.innerHTML = `<span class="neg">Could not reach the viewer API.</span>`;
        simplePollTimer = setTimeout(pollSimple, 8000);
        return;
      }
      if (st.running) simplePollTimer = setTimeout(pollSimple, 2000);
      else if (!st.finished && !st.result) simplePollTimer = setTimeout(pollSimple, 10000);

      const buttons = ["simple-build-xlsx", "simple-build-wiki", "simple-radar-go", "simple-refresh-fund", "simple-analyze-all", "simple-group-review"].map((id) => el.querySelector("#" + id)).filter(Boolean);
      const logHost = el.querySelector("#simple-log");
      renderSimpleLog(st.events || []);

      if (st.running) {
        simpleWasRunning = true;
        buttons.forEach((b) => (b.disabled = true));
        const started = st.started ? new Date(st.started).toTimeString().slice(0, 8) : "";
        progress.innerHTML =
          `<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">` +
          `<span>Running <strong>${esc(st.kind)}</strong></span>` +
          `<span class="timer">${started} · ${fmtSecs(st.elapsed_s)}</span></div>` +
          `<div style="font-size:12px;color:var(--muted)">one simple action at a time — log streams below</div>`;
        if (logHost) logHost.style.display = "block";
        return;
      }

      buttons.forEach((b) => (b.disabled = false));
      if (simpleWasRunning) {
        simpleWasRunning = false;
        loadSimpleData(); // refresh every step's output after a finished action
      }
      if (st.error) {
        progress.innerHTML = `<span class="neg">✗ ${esc(st.kind || "action")} failed: ${esc(st.error)}</span>`;
      } else if (st.result) {
        const r = st.result;
        const bits = Object.entries(r).filter(([k]) => k !== "ideas" && k !== "overflow")
          .map(([k, v]) => `${esc(k)}: <strong>${esc(v)}</strong>`).join(" · ");
        progress.innerHTML = `<div class="pos" style="font-weight:650">✔ ${esc(st.kind || "")} finished</div>` +
          `<div style="margin-top:4px;font-size:13px">${bits}</div>` +
          `<div style="margin-top:4px;font-size:12px;color:var(--muted)">${fmtSecs(st.elapsed_s)} elapsed</div>` +
          (st.error ? `<br><span class="neg">${esc(st.error)}</span>` : "");
      } else {
        progress.innerHTML = `<div style="color:var(--muted)">Idle — pick a step above; its output appears below.</div>`;
      }
    }

    async function loadSimple() {
      const el = document.getElementById("tab-simple");
      el.innerHTML = `
        <div class="dd-batch">
          <strong>PTM-simple — the theme-first process, step by step</strong>
          <p class="hint" style="margin:6px 0 2px">
            Stage 0 builds the <strong>theme map</strong> — either the starter-pack xlsx clusters or a
            <strong>deterministic map computed from each company's Wikipedia industry</strong> (Wikidata P452,
            the field the infobox renders; no LLM, cached per ticker). Stage 1 is the weekly <strong>radar</strong>
            (revision breadth + print calendar, deterministic; the why-now LLM grade is optional). Stage 2
            qual-analyzes EVERY covered member of every non-COLD theme (dive cache-first, forward brief,
            coverage report with the theme-relative valuation flag — no selection, no gates). Stage 3 is the
            <strong>group review</strong>: one pass per theme judging whether each flag is justified by the
            print-focused forward case, from which the deterministic <strong>trade ideas</strong> fall out.
          </p>
          <div class="pipe-form">
            <label>Theme map
              <select id="simple-map">
                <option value="manual">manual — xlsx clusters</option>
                <option value="wiki">wiki — Wikipedia industries</option>
              </select>
            </label>
            <label>Theme
              <select id="simple-theme"><option value="">loading themes…</option></select>
            </label>
            <label title="radar: refresh N member expectation caches per theme">Refresh N
              <input type="number" id="simple-refresh" placeholder="0" min="0" style="width:64px"></label>
            <label title="radar: one LLM call grades WHY-NOW per non-COLD theme">LLM why-now
              <input type="checkbox" id="simple-llm"></label>
            <label title="run: redo the dives even when cached">Force dives
              <input type="checkbox" id="simple-force"></label>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px">
            <button id="simple-build-xlsx">0a · Build themes (xlsx)</button>
            <button id="simple-build-wiki" title="Deterministic Wikipedia-industry map; first build fetches ~1 API call per 50 tickers, a few minutes">0b · Build themes (Wikipedia)</button>
            <button id="simple-radar-go">1 · Run radar</button>
            <button id="simple-inspect" title="Live radar row for one theme: members, coverage, print calendar">2 · Inspect theme</button>
            <button id="simple-refresh-fund" title="Fetch fresh fundamentals for the simple universe — prices (yfinance batch), EDGAR rows at the run date, optionally consensus with the checkbox below — then rebuild the quant table and re-render reports. No LLM calls; a few minutes of network.">Refresh fundamentals</button>
            <button id="simple-analyze-all" title="Qualitative coverage for EVERY covered member of every non-COLD theme: deep dive (cache-first — a first-time dive costs minutes of LLM each, so a full sweep can take hours), forward brief, coverage report with the theme-relative valuation flag. No selection, no gates.">Qual-analyze all members</button>
            <button id="simple-group-review" title="One LLM pass per non-COLD theme: judge whether each member's theme-relative valuation flag (premium/discount vs the theme median) is justified by the print-focused forward case. Run AFTER the coverage reports; commentary, not a gate. Clicking a trade-idea ticker opens its latest print qual.">Group review (flags justified?)</button>
          </div>
          <div class="dd-progress" id="simple-progress"></div>
          <div id="simple-maps" style="margin-top:10px"></div>
        </div>
        <div id="simple-radar-host" style="margin-top:10px"></div>
        <div id="simple-theme-host" style="margin-top:10px"></div>
        <div id="simple-quant-host" style="margin-top:10px"></div>
        <div id="simple-review-host" style="margin-top:10px"></div>
        <div id="simple-trade-host" style="margin-top:10px"></div>
        <div id="simple-reports-host" style="margin-top:10px"></div>
        <div class="dd-log" id="simple-log" style="display:none"></div>`;

      const $ = (id) => el.querySelector("#" + id);

      async function fillThemes() {
        state.simpleMapSource = $("simple-map").value;
        $("simple-theme").innerHTML = `<option value="">loading themes…</option>`;
        try {
          const res = await fetch(`/api/simple/theme-map/${state.simpleMapSource}`);
          const payload = await res.json();
          const themes = (payload.map && payload.map.themes) || [];
          if (payload.error || !themes.length) {
            $("simple-theme").innerHTML = `<option value="">${esc(payload.error || "no themes — build the map first")}</option>`;
            return;
          }
          state.simpleTheme = state.simpleTheme && themes.some((t) => t.theme === state.simpleTheme)
            ? state.simpleTheme : "";
          $("simple-theme").innerHTML =
            `<option value="">— pick a theme —</option>` +
            themes.map((t) => `<option value="${esc(t.theme)}" ${t.theme === state.simpleTheme ? "selected" : ""}>` +
              `${esc(t.theme)} (${(t.members || []).length})</option>`).join("");
        } catch (e) {
          $("simple-theme").innerHTML = `<option value="">theme list unavailable</option>`;
        }
      }
      $("simple-map").value = state.simpleMapSource;
      $("simple-map").addEventListener("change", fillThemes);
      $("simple-theme").addEventListener("change", () => { state.simpleTheme = $("simple-theme").value; });

      async function post(action, extra = {}) {
        const body = { action, map: $("simple-map").value, theme: $("simple-theme").value, ...extra };
        simpleWasRunning = false;
        try {
          const res = await fetch("/api/simple/run", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
          });
          const payload = await res.json();
          if (!res.ok) {
            $("simple-progress").innerHTML = `<span class="neg">${esc(payload.error || "failed to start")}</span>`;
            return;
          }
          $("simple-log").style.display = "block";
          if (simplePollTimer) clearTimeout(simplePollTimer);
          simplePollTimer = setTimeout(pollSimple, 0);
        } catch (e) {
          $("simple-progress").innerHTML = `<span class="neg">${esc(String(e.message || e))}</span>`;
        }
      }
      $("simple-build-xlsx").addEventListener("click", () => post("build-themes"));
      $("simple-build-wiki").addEventListener("click", () => post("build-wiki"));
      $("simple-radar-go").addEventListener("click", () => post("radar", {
        refresh: parseInt($("simple-refresh").value, 10) || 0,
        llm: $("simple-llm").checked,
      }));
      $("simple-refresh-fund").addEventListener("click", () => post("refresh-fundamentals", { estimates: $("simple-force").checked }));
      $("simple-analyze-all").addEventListener("click", () => post("analyze-all", { force: $("simple-force").checked }));
      $("simple-group-review").addEventListener("click", () => post("group-review", {}));
      $("simple-inspect").addEventListener("click", async () => {
        const theme = $("simple-theme").value;
        if (!theme) { $("simple-progress").innerHTML = `<span class="neg">pick a theme first</span>`; return; }
        const host = $("simple-theme-host");
        host.innerHTML = `<p class="muted">Ranking members of ${esc(theme)}…</p>`;
        try {
          const res = await fetch(`/api/simple/theme/${encodeURIComponent(theme)}?source=${encodeURIComponent($("simple-map").value)}`);
          const payload = await res.json();
          renderSimpleThemeDetail(payload, host);
        } catch (e) {
          host.innerHTML = `<p class="err">${esc(String(e.message || e))}</p>`;
        }
      });
      if (simplePollTimer) clearTimeout(simplePollTimer);
      simplePollTimer = setTimeout(pollSimple, 0);
      await fillThemes();
      await loadSimpleData();
    }

    function renderSimpleMaps(host, arts) {
      const maps = (arts && arts.maps) || {};
      host.innerHTML = `<div class="kpis">` + ["manual", "wiki"].map((src) => {
        const m = maps[src] || { exists: false };
        const title = src === "wiki" ? "Wikipedia industries" : "xlsx clusters";
        if (!m.exists) {
          return `<div class="kpi"><div class="lbl">${esc(title)} — not built</div><div class="val" style="font-size:13px">—</div></div>`;
        }
        const extra = src === "wiki" ? ` · ${m.fallbacks} yf fallbacks` : "";
        return `<div class="kpi"><div class="lbl">${esc(title)}</div>` +
          `<div class="val">${esc(m.themes ?? "?")} themes</div>` +
          `<div style="font-size:11px;color:var(--muted)">${esc(m.tickers ?? "?")} tickers${src === "wiki" ? extra : ""} · ${esc(m.mtime || "")}</div></div>`;
      }).join("") +
        `<div class="kpi"><div class="lbl">Radar</div><div class="val" style="font-size:14px">${esc(arts.radar_date || "none")}</div></div>` +
        `<div class="kpi"><div class="lbl">Book</div><div class="val" style="font-size:14px">${arts.book ? `${arts.book.ideas} ideas (${esc(arts.book.as_of)})` : "none"}</div></div>` +
        `<div class="kpi"><div class="lbl">Parked</div><div class="val">${arts.watchlist ? arts.watchlist.parked : 0}</div></div>` +
        `<div class="kpi"><div class="lbl">Idea reports</div><div class="val">${arts.reports || 0}</div></div>` +
        `</div>`;
    }

    function renderSimpleRadar(host, radar) {
      if (!radar || radar.error) {
        host.innerHTML = `<div class="dd-batch"><strong>1 · Radar</strong><p class="muted" style="margin:4px 0 0">${esc((radar && radar.error) || "no radar yet — run step 1")}</p></div>`;
        return;
      }
      // one column definition drives both the table and its filter bar
      const cols = [
        { key: "status", label: "Status", filter: "select", fmt: (v) => simpleStatusChip(v) },
        { key: "theme", label: "Theme", filter: "text", fmt: (v, r) => `<strong>${esc(v)}</strong>${r.bellwether ? ` <span class="muted">· bellwether ${esc(r.bellwether)}</span>` : ""}` },
        { key: "lean", label: "Lean", filter: "select" },
        { key: "breadth", label: "Breadth", filter: "min", minAbs: true, minStep: 0.1, fmt: (v) => (v == null ? "" : (v > 0 ? "+" : "") + Number(v).toFixed(2)) },
        { key: "coverage", label: "Cov", filter: "min", pct: true, minStep: 10, fmt: (v) => (v == null ? "" : Math.round(v * 100) + "%") },
        { key: "members_covered", label: "Cov/#", filter: "min", minStep: 1 },
        { key: "prints", label: "Prints 14d", filter: "min", minStep: 1 },
        { key: "divergent", label: "Against theme", filter: "text", title: "Members revising against the theme's breadth — the laggard (short) inside a rising theme or the share-gainer (long) inside a falling one; the 'know more than the market' candidates", fmt: (v) => (v || []).join(", ") },
        { key: "members_list", label: "Members", filter: "text", wrap: true, title: "Every ticker in the theme — covered = solid (has expectations data), muted = uncovered. Type a ticker to find its themes", fmt: (v) => (v || []).map((m) => m.covered
          ? `<strong style="font-variant-numeric:tabular-nums">${esc(m.ticker)}</strong>`
          : `<span class="muted" title="no expectations cache — not scored">${esc(m.ticker)}</span>`).join(" · ") },
        { key: "why", label: "Why-now", filter: "select" },
      ];
      const rows = (radar.themes || []).map((r) => ({
        ...r,
        why: (r.why_now && r.why_now.grade) || "",
        prints: (r.prints_14d || []).length,
        members_list: (radar.members || {})[r.theme] || [],
      }));
      simpleRadar.rows = rows;
      simpleRadar.cols = cols;
      const active = rows.filter((r) => r.status !== "COLD");
      host.innerHTML = `
        <div class="dd-batch">
          <strong>1 · Theme radar — as of ${esc(radar.as_of)}</strong>
          <p class="hint" style="margin:4px 0 6px">${active.length} of ${rows.length} themes not COLD · map: ${esc(radar.map_source || "?")}. Breadth = share of covered members with 90d estimate revisions beyond ±0.5% (up − down). "Against theme" counts members revising opposite to the cluster — the process's divergence patterns (the laggard short inside a rising theme, the share-gainer long inside a falling one); aligned riders are the default picks.</p>
          <div class="filters" id="simple-radar-filters"></div>
          <p class="hint" style="margin:0 0 4px" id="simple-radar-count"></p>
          <div id="simple-radar"></div>
        </div>`;
      buildSimpleRadarFilters(host.querySelector("#simple-radar-filters"));
      applySimpleRadarFilters(host);
    }

    // module-level so filters survive data refreshes within the session
    const simpleRadar = { rows: [], cols: [], filters: {} };

    function buildSimpleRadarFilters(filtersHost) {
      const { cols, rows, filters } = simpleRadar;
      filtersHost.innerHTML = cols.map((c) => {
        if (c.filter === "select") {
          const values = [...new Set(rows.map((r) => String(r[c.key] ?? "")))].filter(Boolean).sort();
          const options = [`<option value="">${esc(c.label)}: all</option>`]
            .concat(values.map((v) => `<option value="${esc(v)}" ${filters[c.key] === v ? "selected" : ""}>${esc(v)}</option>`));
          return `<label style="font-size:11px">${esc(c.label)}<select data-fkey="${esc(c.key)}">${options.join("")}</select></label>`;
        }
        if (c.filter === "min") {
          return `<label style="font-size:11px"${c.minAbs ? ` title="filters on the |${esc(c.label)}| magnitude"` : ""}>${esc(c.label)} ≥ <input type="number" step="${c.minStep ?? 1}" placeholder="min" style="width:70px" data-min="${esc(c.key)}" value="${esc(filters[c.key] ?? "")}"></label>`;
        }
        return `<label style="font-size:11px">${esc(c.label)}<input type="text" placeholder="contains…" style="width:110px" data-text="${esc(c.key)}" value="${esc(filters[c.key] || "")}"></label>`;
      }).join("") + `<button id="simple-radar-clear" style="font-size:11px">Clear</button>`;
      const rerender = () => applySimpleRadarFilters(filtersHost.closest(".dd-batch").parentElement);
      filtersHost.querySelectorAll("select[data-fkey]").forEach((sel) => {
        sel.addEventListener("change", () => {
          if (sel.value) filters[sel.dataset.fkey] = sel.value;
          else delete filters[sel.dataset.fkey];
          rerender();
        });
      });
      filtersHost.querySelectorAll("input[data-text]").forEach((inp) => {
        inp.addEventListener("input", () => {
          if (inp.value) filters[inp.dataset.text] = inp.value;
          else delete filters[inp.dataset.text];
          rerender();
        });
      });
      filtersHost.querySelectorAll("input[data-min]").forEach((inp) => {
        inp.addEventListener("input", () => {
          if (inp.value !== "") filters[inp.dataset.min] = inp.value;
          else delete filters[inp.dataset.min];
          rerender();
        });
      });
      filtersHost.querySelector("#simple-radar-clear").addEventListener("click", () => {
        simpleRadar.filters = {};
        buildSimpleRadarFilters(filtersHost);
        rerender();
      });
    }

    function applySimpleRadarFilters(host) {
      const tableHost = host.querySelector("#simple-radar");
      const countHost = host.querySelector("#simple-radar-count");
      if (!tableHost) return;
      const filtered = simpleRadar.rows.filter((r) => simpleRadar.cols.every((c) => {
        const v = simpleRadar.filters[c.key];
        if (v == null || v === "") return true;
        if (c.filter === "select") return String(r[c.key] ?? "") === String(v);
        if (c.filter === "min") {
          const raw = r[c.key];
          if (raw == null) return false;
          const num = c.pct ? Number(raw) * 100 : (c.minAbs ? Math.abs(Number(raw)) : Number(raw));
          return num >= Number(v);
        }
        // text: substring over the raw field (arrays become their joined tickers)
        const hay = Array.isArray(r[c.key]) ? r[c.key].map((x) => x.ticker ?? x).join(" ") : String(r[c.key] ?? "");
        return hay.toLowerCase().includes(String(v).toLowerCase());
      }));
      if (countHost) countHost.textContent = `showing ${filtered.length} of ${simpleRadar.rows.length} themes`;
      attachTable(tableHost, filtered, simpleRadar.cols, { tableId: "simple-radar" });
    }

    function renderSimpleThemeDetail(payload, host) {
      if (payload.error) { host.innerHTML = `<p class="err">${esc(payload.error)}</p>`; return; }
      const row = payload.row || {};
      const breadth = row.breadth || 0;
      const withCount = (payload.members || []).filter((m) => m.covered && (m.rev90 || 0) * breadth >= 0).length;
      const againstCount = (payload.members || []).filter((m) => m.covered && (m.rev90 || 0) * breadth < 0).length;
      const memCols = [
        { key: "ticker", label: "Ticker", fmt: (v) => `<strong>${esc(v)}</strong>` },
        { key: "covered", label: "Cov", fmt: (v) => (v ? "✔" : "—") },
        { key: "rev90", label: "90d est", fmt: (v) => (v == null ? "" : (v > 0 ? "+" : "") + Number(v).toFixed(1) + "%") },
        { key: "up30", label: "Up 30d" },
        { key: "down30", label: "Down 30d" },
        { key: "days_to_print", label: "Print in d" },
        { key: "earnings_date", label: "Next print" },
        { key: "market_cap", label: "Mcap $bn", fmt: (v) => (v == null ? "" : (v / 1e9).toFixed(1)) },
        { key: "align", label: "vs theme", title: "'with' revises the same way the theme's breadth points (the rider); 'against' is the divergence pattern the process flags — the laggard (short) or share-gainer (long). The name's own estimate direction always decides its side, never the theme's.", fmt: (v) => (v ? `<span class="badge${v === "against" ? " info" : ""}">${esc(v)}</span>` : "") },
      ];
      host.innerHTML = `
        <div class="dd-batch">
          <strong>2 · Theme detail — ${esc(row.theme || "")}</strong>
          <p class="hint" style="margin:4px 0 6px">Status ${simpleStatusChip(row.status)} · lean ${esc(row.lean || "")} · breadth ${(row.breadth > 0 ? "+" : "") + Number(row.breadth || 0).toFixed(2)} · coverage ${Math.round((row.coverage || 0) * 100)}% (${row.members_covered}/${row.members_total}) · bellwether ${esc(row.bellwether || "—")} · <span class="badge">${withCount} with theme</span> <span class="badge info">${againstCount} against</span></p>
          <p class="hint" style="margin:0 0 6px">Sides come from each name's OWN 90d estimate direction, never the theme's: a name revising against its theme is a diverger traded on its own direction.</p>
          <details style="margin-top:8px" open><summary class="muted">All ${payload.members ? payload.members.length : 0} members</summary><div id="simple-members" style="margin-top:6px"></div></details>
        </div>`;
      if (payload.members && payload.members.length) {
        const memRows = payload.members.map((m) => ({
          ...m,
          align: !m.covered ? "" : ((m.rev90 || 0) * breadth >= 0 ? "with" : "against"),
        }));
        attachTable(host.querySelector("#simple-members"), memRows, memCols, { tableId: "simple-members" });
      }
    }

    function renderSimpleQuant(host, quant) {
      if (!host) return;
      const allRows = (quant && quant.rows) || [];
      if (!allRows.length) {
        host.innerHTML = `<div class="dd-batch"><strong>Quant table (deterministic)</strong><p class="muted" style="margin:4px 0 0">no quant table yet — run analyze-all</p></div>`;
        return;
      }
      const f2 = (v) => (v == null ? "—" : Number(v).toFixed(2));
      const pct = (v) => (v == null ? "—" : (v >= 0 ? "+" : "") + (v * 100).toFixed(1) + "%");
      const pctRaw = (v) => (v == null ? "—" : (v >= 0 ? "+" : "") + Number(v).toFixed(1) + "%");
      const print = (r) => (r.days_to_print == null ? "—" : `${r.days_to_print}d`);
      const themes = [...new Set(allRows.map((r) => r.theme).filter(Boolean))].sort();
      const opt = (v) => `<option value="${esc(v)}">${esc(v)}</option>`;
      const sideOf = (r) => ((r.rev90 || 0) > 0.5 ? "long" : (r.rev90 || 0) < -0.5 ? "short" : "flat");
      host.innerHTML = `<div class="dd-batch"><strong>Quant table (deterministic — ${allRows.length} names in ${esc((quant.themes || []).length)} non-COLD themes)</strong>` +
        `<p class="muted" style="margin:4px 0">P/S · FY1/FY2 consensus EPS · PE1/PE2 · PEG1/PEG2 · rev90 (own 90d estimate change) · days to next print. Reference numbers, not a ranking — computed from the cached fundamentals table (EDGAR XBRL + analyst consensus), no LLM, no network.</p>` +
        `<p class="muted" style="margin:2px 0"><strong style="color:#c9d1e0">Flag formula</strong> — per theme: median of members' forward P/E (PE1) and PEG (PEG1), each median needing ≥ 3 names with that multiple; compare each name to its own theme —` +
        ` <span class="badge" title="PE1 / theme median PE1 >= 1.5">P/E1 ÷ median ≥ 1.5× or PEG1 ÷ median ≥ 1.5× → premium</span>` +
        ` <span class="badge" title="at most 0.67x the theme median — at least a third cheaper">≤ 0.67× median → discount</span>` +
        ` <span class="badge info">one ratio ≥ 1.5× AND the other ≤ 0.67× → mixed</span>` +
        ` <span class="muted">neither extreme → fair · theme has &lt; 3 names with a multiple → n/a. Theme-relative only: a 12× P/E is a premium when the theme's median is 8× and fair when the median is 12×. The flag never gates or ranks — whether it is justified comes from the group review.</span></p>` +
        `<div style="margin:6px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center">` +
        `<input id="quant-search" placeholder="ticker…" style="width:90px">` +
        `<select id="quant-side">` +
        `<option value="">side: all</option>` +
        `<option value="long">long (own est. rising)</option>` +
        `<option value="short">short (own est. falling)</option>` +
        `<option value="flat">flat (no side)</option>` +
        `</select>` +
        `<select id="quant-theme"><option value="">theme: all</option>${themes.map(opt).join("")}</select>` +
        `<span id="quant-count" class="muted" style="margin-left:auto"></span></div>` +
        `<div style="max-height:60vh;overflow:auto;border:1px solid #2a2e35">` +
        `<table style="width:100%;border-collapse:separate;border-spacing:0;font-size:12px">` +
        `<thead><tr>` +
        ["Ticker", "Side", "Flag", "Price", "P/S", "FY1 EPS", "FY2 EPS", "EG1 → EG2", "PE1", "PE2", "PEG1", "PEG2", "rev90", "print"]
          .map((h) => `<th style="text-align:left;padding:5px 8px;border-bottom:1px solid #2a2e35;position:sticky;top:0;background:#1b1e24;z-index:2">${h}</th>`).join("") +
        `</tr></thead><tbody id="quant-body"></tbody></table></div>` +
        (quant.as_of ? `<p class="muted" style="margin:4px 0 0">run ${esc(quant.as_of)}${quant.note ? " · " + esc(quant.note) : ""}</p>` : "") +
        `</div>`;
      const tbody = host.querySelector("#quant-body");
      const search = host.querySelector("#quant-search");
      const sideSel = host.querySelector("#quant-side");
      const themeSel = host.querySelector("#quant-theme");
      const count = host.querySelector("#quant-count");
      const draw = () => {
        const q = (search.value || "").trim().toUpperCase();
        const side = sideSel.value;
        const th = themeSel.value;
        const rows = allRows.filter((r) => {
          if (q && !`${r.ticker} ${r.name || ""}`.toUpperCase().includes(q)) return false;
          if (th && r.theme !== th) return false;
          if (side && sideOf(r) !== side) return false;
          return true;
        });
        let body = "";
        let lastTheme = null;
        for (const r of rows) {
          if (r.theme !== lastTheme) {
            lastTheme = r.theme;
            body += `<tr><th colspan="14" style="text-align:left;background:var(--bg,#14161a)">` +
              `${esc(r.theme)} — ${esc(r.status || "")} · lean ${esc(r.lean || "")} (breadth ${(r.breadth >= 0 ? "+" : "") + Number(r.breadth || 0).toFixed(2)})</th></tr>`;
          }
          const rside = sideOf(r);
          const sideCell = rside === "flat"
            ? `<span class="muted">flat</span>`
            : `<span class="${rside === "long" ? "pos" : "neg"}"><strong>${rside}</strong></span>`;
          const flag = r.flag || "n/a";
          const flagCls = flag === "premium" ? "neg" : flag === "discount" ? "pos" : "muted";
          body += `<tr>` +
            `<td><strong>${esc(r.ticker)}</strong></td>` +
            `<td>${sideCell}</td>` +
            `<td><span class="${flagCls}" title="${esc(r.flag_detail || "")}">${esc(flag)}</span></td>` +
            `<td>${f2(r.price)}</td>` +
            `<td>${f2(r.ps)}</td>` +
            `<td>${f2(r.eps1)}</td>` +
            `<td>${f2(r.eps2)}</td>` +
            `<td>${pct(r.eg1)} → ${pct(r.eg2)}</td>` +
            `<td>${f2(r.pe1)}</td>` +
            `<td>${f2(r.pe2)}</td>` +
            `<td>${f2(r.peg1)}</td>` +
            `<td>${f2(r.peg2)}</td>` +
            `<td>${pctRaw(r.rev90)}</td>` +
            `<td>${print(r)}</td>` +
            `</tr>`;
        }
        tbody.innerHTML = body || `<tr><td colspan="14" style="padding:8px"><span class="muted">no rows match</span></td></tr>`;
        count.textContent = `${rows.length} of ${allRows.length} shown`;
      };
      search.addEventListener("input", draw);
      [sideSel, themeSel].forEach((s) => s.addEventListener("change", draw));
      draw();
    }

    function renderSimpleReview(host, review) {
      if (!host) return;
      const themes = (review && review.themes) || [];
      if (!themes.length) {
        host.innerHTML = `<div class="dd-batch"><strong>Group review (flags justified?)</strong><p class="muted" style="margin:4px 0 0">no group review yet — run the coverage sweep, then "Group review"</p></div>`;
        return;
      }
      const mark = (v) => ({ "justified": `<span class="pos">✅ justified</span>`, "not justified": `<span class="neg">❌ not justified</span>`, "uncertain": `<span class="muted">❔ uncertain</span>` }[v] || `<span class="muted">❔ ${esc(v)}</span>`);
      const flagCls = (f) => (f === "premium" ? "neg" : f === "discount" ? "pos" : "muted");
      const ideaMark = { "aligned": `<span class="pos" title="the verdict agrees with the side — a trade candidate">✅ idea</span>`, "contradicted": `<span class="neg" title="the verdict argues against the side">⛔ against</span>`, "neutral": `<span class="muted">—</span>` };
      let body = "";
      for (const t of themes) {
        body += `<div class="dd-batch" style="margin-top:8px">` +
          `<strong>${esc(t.theme)}</strong> — ${esc(t.status || "n/a")}, lean ${esc(t.lean || "?")} (breadth ${(t.breadth >= 0 ? "+" : "") + Number(t.breadth || 0).toFixed(2)}) · ${t.members_reviewed || 0} reviewed` +
          (t.members_skipped_flat && t.members_skipped_flat.length ? ` · <span class="muted">no data, skipped: ${esc(t.members_skipped_flat.join(", "))}</span>` : "") +
          (t.summary ? `<p class="muted" style="margin:4px 0">${esc(t.summary)}</p>` : "") +
          (t.reviews && t.reviews.length
            ? `<div style="max-height:260px;overflow:auto;border:1px solid #2a2e35"><table style="width:100%;border-collapse:separate;border-spacing:0;font-size:12px">` +
              `<thead><tr>` +
              ["Ticker", "Side", "Flag", "Verdict", "Idea", "Watch", "Why"].map((h) => `<th style="text-align:left;padding:4px 8px;border-bottom:1px solid #2a2e35;position:sticky;top:0;background:#1b1e24;z-index:1">${h}</th>`).join("") +
              `</tr></thead><tbody>` +
              t.reviews.map((r) => `<tr>` +
                `<td style="padding:4px 8px"><strong class="linklike" data-pq="${esc(r.printqual || "")}" title="${r.printqual ? "open the latest print qual" : "no print qual yet"}" style="cursor:pointer">${esc(r.ticker)}</strong></td>` +
                `<td style="padding:4px 8px"><span class="${r.side === "long" ? "pos" : r.side === "short" ? "neg" : ""}">${esc(r.side || "")}</span></td>` +
                `<td style="padding:4px 8px"><span class="${flagCls(r.flag)}">${esc(r.flag || "n/a")}</span></td>` +
                `<td style="padding:4px 8px">${mark(r.verdict)}</td>` +
                `<td style="padding:4px 8px">${ideaMark[r.trade || "neutral"] || ideaMark.neutral}</td>` +
                `<td style="padding:4px 8px">${esc((r.watch || []).slice(0, 2).join(" · "))}</td>` +
                `<td style="padding:4px 8px">${esc(r.reason || "")}</td>` +
                `</tr>`).join("") +
              `</tbody></table></div>`
            : `<p class="muted" style="margin:4px 0 0">no members with data or a flag</p>`) +
          `</div>`;
      }
      host.innerHTML = `<div class="dd-batch"><strong>Group review — ${themes.length} non-COLD theme(s) · ${esc(review.file || "")}</strong>` +
        `<p class="muted" style="margin:4px 0">One pass per theme over every covered member: is the theme-relative valuation flag (P/E & PEG vs theme median) justified by the print-focused forward case? Side = the name's own 90d revisions; the verdict judges the flag, not the trade. Commentary, not a gate. Click a ticker to open its print qual.</p></div>` + body;
      host.querySelectorAll("[data-pq]").forEach((td) => {
        td.addEventListener("click", () => openSimpleReport(td.dataset.pq || ""));
      });
    }

    function renderSimpleTradeIdeas(host, review) {
      if (!host) return;
      const themes = (review && review.themes) || [];
      const rows = [];
      for (const t of themes) {
        for (const r of t.reviews || []) {
          if (r.trade === "aligned") rows.push({ ...r, theme: t.theme });
        }
      }
      if (!rows.length) {
        host.innerHTML = `<div class="dd-batch"><strong>Trade ideas (side × flag × verdict)</strong><p class="muted" style="margin:4px 0 0">none yet — run "Group review" first; ideas are the deterministic aligned combinations (long+premium justified, long+discount not justified, short+discount justified, short+premium not justified, and fair/mixed justified on either side).</p></div>`;
        return;
      }
      const mark = (v) => ({ "justified": "✅", "not justified": "❌", "uncertain": "❔" }[v] || "❔");
      const flagCls = (f) => (f === "premium" ? "neg" : f === "discount" ? "pos" : "muted");
      const chip = (r) => {
        const hasPq = !!r.printqual;
        return `<div class="dd-batch" style="margin:6px 0;padding:8px 10px;border:1px solid #2a2e35">` +
          `<span class="${r.side === "long" ? "pos" : "neg"}" style="font-size:12px"><strong>${esc(r.side || "")}</strong></span>` +
          ` <strong class="linklike" data-pq="${esc(r.printqual || "")}" title="${hasPq ? "open the latest print qual for " + esc(r.ticker) : "no print qual yet"}" style="cursor:pointer">${esc(r.ticker)}</strong>` +
          ` <span class="muted" style="font-size:12px">${esc(r.theme)}</span> · ` +
          `<span class="${flagCls(r.flag)}" style="font-size:12px">${esc(r.flag || "")}</span> · ` +
          `${mark(r.verdict)} ${esc(r.verdict)}` +
          `<div class="muted" style="font-size:12px;margin-top:2px">${esc(r.reason || "")}</div>` +
          ((r.watch || []).length ? `<div class="muted" style="font-size:12px;margin-top:2px">watch: ${esc(r.watch.slice(0, 2).join(" · "))}</div>` : "") +
          `</div>`;
      };
      const wrong = rows.filter((r) => r.verdict === "not justified");
      const right = rows.filter((r) => r.verdict === "justified");
      host.innerHTML = `<div class="dd-batch"><strong>Trade ideas — ${rows.length} aligned name(s)</strong>` +
        `<p class="muted" style="margin:4px 0">Deterministic on the group review — no LLM, no gate: <span class="pos">long + premium justified</span>, <span class="pos">long + discount not justified</span>, <span class="neg">short + discount justified</span>, <span class="neg">short + premium not justified</span>. Click a ticker to open its latest print qual.</p>` +
        (wrong.length ? `<p style="margin:6px 0 2px"><strong>The market is wrong (mispriced)</strong> — <span class="muted" style="font-size:12px">${wrong.length}</span></p>` + wrong.map(chip).join("") : "") +
        (right.length ? `<p style="margin:8px 0 2px"><strong>The market is right, ride it</strong> — <span class="muted" style="font-size:12px">${right.length}</span></p>` + right.map(chip).join("") : "") +
        `</div>`;
      host.querySelectorAll("[data-pq]").forEach((elq) => {
        elq.addEventListener("click", () => openSimpleReport(elq.dataset.pq || ""));
      });
    }

    async function loadSimpleData() {
      const el = document.getElementById("tab-simple");
      if (!el.querySelector("#simple-maps")) return;
      const status = await (await fetch("/api/simple/status")).json();
      renderSimpleMaps(el.querySelector("#simple-maps"), status.artifacts || {});
      const [radar, reports, quant, review] = await Promise.all([
        fetch("/api/simple/radar").then((r) => r.json()).catch(() => null),
        fetch("/api/simple/reports").then((r) => r.json()).catch(() => null),
        fetch("/api/simple/quant").then((r) => r.json()).catch(() => null),
        fetch("/api/simple/review").then((r) => r.json()).catch(() => null),
      ]);
      renderSimpleRadar(el.querySelector("#simple-radar-host"), radar && radar.radar);
      renderSimpleQuant(el.querySelector("#simple-quant-host"), quant && quant.quant);
      renderSimpleReview(el.querySelector("#simple-review-host"), review && review.review);
      renderSimpleTradeIdeas(el.querySelector("#simple-trade-host"), review && review.review);
      const repHost = el.querySelector("#simple-reports-host");
      const list = (reports && reports.reports) || [];
      const repParts = (p) => p.split(/[\\/]/);
      const repLabel = (p) => {
        const parts = repParts(p);
        const base = (parts[parts.length - 1] || "").replace(/\.md$/, "");
        if (base.startsWith("_")) return base.slice(1).replace(/_/g, " ");  // e.g. GROUP REVIEW 2026-09-02
        const tokens = base.split("_");
        const stamp = tokens.pop() || "";
        const ticker = tokens.pop() || "";
        const side = (tokens.shift() || "").toUpperCase();
        return `${side} ${ticker} · ${stamp}`;
      };
      const byTheme = {};
      for (const r of list) {
        const parts = repParts(r.path);
        const theme = parts.length > 1 ? parts[0] : "(this run)";
        (byTheme[theme] = byTheme[theme] || []).push(r);
      }
      const optgroups = Object.keys(byTheme).sort().map((theme) => {
        const opts = byTheme[theme]
          .slice()
          .sort((a, b) => b.path.localeCompare(a.path))
          .map((r) => `<option value="${esc(r.path)}">${esc(repLabel(r.path))}</option>`)
          .join("");
        return `<optgroup label="${esc(theme)}">${opts}</optgroup>`;
      }).join("");
      repHost.innerHTML = `<div class="dd-batch"><strong>Idea reports (${list.length})</strong>` +
        (list.length
          ? `<div style="margin-top:6px"><select id="simple-rep-select" style="min-width:360px;max-width:100%">` +
            `<option value="">— pick a report —</option>${optgroups}</select>` +
            ` <button id="simple-rep-open" style="font-size:12px">Open</button></div>`
          : `<p class="muted" style="margin:4px 0 0">no reports yet</p>`) +
        `</div>`;
      const openReport = openSimpleReport;
      const sel = repHost.querySelector("#simple-rep-select");
      const openBtn = repHost.querySelector("#simple-rep-open");
      if (sel) {
        sel.addEventListener("change", () => openReport(sel.value));
        openBtn && openBtn.addEventListener("click", () => openReport(sel.value));
      }
    }

    // --- Setups tab: the group-only fundamental ranking ---------------------
    // Same deterministic front half as the Simple tab and the same artifacts
    // for it (theme map, radar, quant table all under data/simple/, read here
    // through /api/simple/*), and a completely different qualitative half:
    // ONE ranking pass per non-COLD industry over ALL of its members at once,
    // then one cross-industry final over the winners. No per-name deep dive,
    // no per-name brief, no flag verdict. Fundamentals, filed guidance,
    // consensus revisions and valuation only — no technicals and no price
    // action anywhere, which is why the third column of every table is the
    // print SETUP rather than a trend. Its own state and output stream from
    // /api/setups/*, whose handlers live in ptm_setups/viewer.py.
    let setupsPollTimer = null;
    let setupsWasRunning = false;
    const SETUPS_BUTTONS = ["setups-build-xlsx", "setups-build-wiki", "setups-radar-go",
                            "setups-refresh-fund", "setups-rank"];

    function renderSetupsLog(events) {
      const logHost = document.querySelector("#setups-log");
      if (!logHost) return;
      logHost.innerHTML = (events || []).map((e) => {
        const time = e.t ? new Date(e.t).toTimeString().slice(0, 8) : "";
        return `<div><span class="t">${time}</span> ${esc((e.line || "").replace(/^\[\d{2}:\d{2}:\d{2}\]\s*/, ""))}</div>`;

    async function pollSetups() {
      const el = document.getElementById("tab-setups");
      const progress = el && el.querySelector("#setups-progress");
      if (!progress) return; // tab closed; the action continues server-side
      let st;
      try {
        const res = await fetch("/api/setups/status");
        st = await res.json();
      } catch (e) {
        progress.innerHTML = `<span class="neg">Could not reach the viewer API.</span>`;
        setupsPollTimer = setTimeout(pollSetups, 8000);
        return;
      }
      if (st.running) setupsPollTimer = setTimeout(pollSetups, 2000);
      else if (!st.finished && !st.result) setupsPollTimer = setTimeout(pollSetups, 10000);

      const buttons = SETUPS_BUTTONS.map((id) => el.querySelector("#" + id)).filter(Boolean);
      const logHost = el.querySelector("#setups-log");
      renderSetupsLog(st.events || []);

      if (st.running) {
        setupsWasRunning = true;
        buttons.forEach((b) => (b.disabled = true));
        const started = st.started ? new Date(st.started).toTimeString().slice(0, 8) : "";
        progress.innerHTML =
          `<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">` +
          `<span>Running <strong>${esc(st.kind)}</strong></span>` +
          `<span class="timer">${started} · ${fmtSecs(st.elapsed_s)}</span></div>` +
          `<div style="font-size:12px;color:var(--muted)">one ranking action at a time — log streams below</div>`;
        if (logHost) logHost.style.display = "block";
        return;
      }

      buttons.forEach((b) => (b.disabled = false));
      if (setupsWasRunning) {
        setupsWasRunning = false;
        loadSetupsData(); // refresh every output after a finished action
      }
      if (st.error) {
        progress.innerHTML = `<span class="neg">✗ ${esc(st.kind || "action")} failed: ${esc(st.error)}</span>`;
      } else if (st.result) {
        const bits = Object.entries(st.result)
          .map(([k, v]) => `${esc(k)}: <strong>${esc(v)}</strong>`).join(" · ");
        progress.innerHTML = `<div class="pos" style="font-weight:650">✔ ${esc(st.kind || "")} finished</div>` +
          `<div style="margin-top:4px;font-size:13px">${bits}</div>` +
          `<div style="margin-top:4px;font-size:12px;color:var(--muted)">${fmtSecs(st.elapsed_s)} elapsed</div>`;
      } else {
        progress.innerHTML = `<div style="color:var(--muted)">Idle — pick a step above; its output appears below.</div>`;
      }
    }

      async function fillThemes() {

      async function post(action, extra = {}) {
        const body = { action, map: $("setups-map").value, theme: $("setups-theme").value, ...extra };
        setupsWasRunning = false;
        try {
          const res = await fetch("/api/setups/run", {

    function setupsRow(r, extraCells) {
      const sideCls = r.side === "long" ? "pos" : r.side === "short" ? "neg" : "muted";
      const warn = r.against_revisions
        ? ` <span class="neg" title="this side opposes the direction of the name's own FY1 revisions (${esc(r.revision_prior || "")} prior) — the risk column says why">⚠</span>`
        : "";
      return `<tr>` +
