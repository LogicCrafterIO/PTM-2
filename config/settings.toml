[universe]
indices = ["sp500", "sp400", "sp600"]
wikipedia = { sp500 = "https://en.wikipedia.org/wiki/List_of_S%26P_500_companies", sp400 = "https://en.wikipedia.org/wiki/List_of_S%26P_400_companies", sp600 = "https://en.wikipedia.org/wiki/List_of_S%26P_600_companies" }

[filters]
long_mcap_min = 3_000_000_000
long_mcap_max = 10_000_000_000
# Shorts have no size floor. 0 disables it. mcap_ok is the FIRST ranking key, so
# a floor did not merely cap small shorts - it demoted every sub-floor name
# beneath every large cap regardless of idea quality, and only 3 of 23 ready
# shorts cleared $20bn, which held the short side to 4 names on every run.
short_mcap_min = 0
max_positions = 12
max_per_sector = 2   # per side: six shorts from one sector is one bet, not six
# short_max_below_mcap (how many shorts may sit under short_mcap_min) is
# deliberately unset. The machinery survives in book.py and re-enables by
# setting this and short_mcap_min together; it is off because the size
# constraint was doing more damage to the short book than the borrow and
# squeeze risk it guarded against.
# A P/E-outlier screen is beta-long by construction (growth longs, value shorts), so a
# dollar-neutral book still breaches the beta limit. Swap the fewest names to fix it.
beta_aware_selection = true
# A beta hedge is portfolio construction, not a new source of alpha. Never swap
# in a null/negative revision signal, and require the replacement to retain at
# least this fraction of the displaced name's revision-momentum score.
beta_swap_min_momentum_ratio = 0.65
# Rank the book's selection by qualitative conviction (net evidence for minus against)
# AHEAD of earnings growth. By selection time every name is already a P/E outlier that
# fits an EG case and passed the gate, and eg1 is not comparable across cases - a
# turnaround's is negative by definition, which buried all 22 of them on one run.
# Size band and ISM tilt still lead. Does not affect RANKING.md, which predates research.
qual_rank = true
min_positions = 8
exclude_sectors = ["Health Care"]  # skip pharma/biotech-heavy names in v1 via GICS Healthcare optional; screen still includes sector unless flagged
skip_healthcare_v1 = false
min_sector_names = 2  # block one-name "sector" PE outliers; live GICS groups are much larger
# Relative ceiling for LONGS: reject a name priced above this multiple of its sector
# median. max_screen_pe catches a near-zero EPS; this catches a real but indefensible
# valuation (RXO reached the book at 8.7x sector). These names stay in the benchmark -
# the valuation is real, it just is not a trade. 0 disables.
max_sector_pe_multiple = 5.0
# The same ceiling measured against growth instead of against nothing:
# (pe1/sector_pe1) / ((1+eg1)/(1+sector_eg1)). Below 1.0 the extra growth more
# than covers the extra multiple. max_sector_pe_multiple happily admits a name
# paying 3x its sector multiple for flat earnings, which is exactly what two
# independent reviews of one book both flagged (CWST 3.80, CRK 3.97). Longs
# only - shorts are discount-multiple by construction. 0 disables.
max_relative_peg = 3.0
max_screen_pe = 200.0  # above this the P/E reflects a near-zero EPS, not a valuation; excluded from the screen
# A passing verdict must be able to size at least one of its reasons. Applied
# only to verdicts that came back true - a quality bar on a pass, not a second
# way to fail - and counted after wrong-signed reasons are re-filed. Two names
# in one book reached it on three unquantified reasons each (OGN, RSI) and both
# were rejected by two independent human reviews on exactly that basis. 0 disables.
min_quantified_for = 1
# Block a name whose own filings point against the analyst revision that ranks
# it. The book follows revision momentum, so this is where filings still bite -
# as a risk control, not a signal. Filings are backward looking and cannot show
# that analysts are wrong; they can show that following a revision would mean
# ignoring the company's own reported numbers. false ranks on momentum alone.
revision_veto = true
require_eg_case = true  # a candidate must fit one of the process EG cases, not merely have an extreme P/E
# The catalyst window, in CALENDAR days. The upper bound is the PTM horizon: the
# process states 20-60 TRADING days, which is 30-90 calendar days.
#
# The LOWER bound was 30 and is now 0, because it was excluding the best ideas
# for the stated goal. A name reporting in six days failed the gate for being
# "too soon": 13 candidates were rejected on that alone, seven of them with
# rising estimates, improving filings and momentum building - MRVL at 6 days,
# AGX and CIEN at 13. Meanwhile the book filled with names 68-81 days out, where
# revision momentum has the longest time to decay before the catalyst.
#
# The original 30-day floor was a HOLDING-period argument (time to establish a
# position before the print), not a signal one. If you need days to get set,
# raise this to 3-5 rather than back to 30.
catalyst_window_days = [0, 90]

[macro]
bear_drawdown = 0.20
ism_expansion = 50.0
ism_peak = 60.0
ism_trough_low = 40.0
ism_trough_high = 45.0
umcsi_bull = 80.0
umcsi_benign_low = 70.0
# Building permits (FRED PERMIT), year-over-year. Housing turns six to twelve
# months before employment and capex, which is why it sits in the Conference
# Board LEI. A decline past permits_recession is the size that has preceded past
# US recessions - unless the 3m/3m read is already turning up, which is a trough
# rather than a contraction.
permits_strong = 0.05
permits_weak = -0.05
permits_recession = -0.15
nfib_strong = 100.0
nfib_warning = 95.0
real_rate_cheap = 0.01
curve_invert = 0.0
bias_long_threshold = 0.30
bias_short_threshold = -0.30

[prm]
# beta_net_limit is the only enforced risk limit. min_r_score, gross_limit,
# cash_net_limit, amber_size and the whole [timing] block were removed with the
# ATR stop and R-score: nothing read them. See ptm/risk.py.
beta_net_limit = 0.30

[yfinance]
spx = "^GSPC"
vix = "^VIX"
tnx = "^TNX"
fvx = "^FVX"
irx = "^IRX"
wti = "CL=F"
brent = "BZ=F"
copper = "HG=F"
dxy = "DX-Y.NYB"
lqd = "LQD"
hyg = "HYG"

[fred]
gdp = "GDPC1"
cpi = "CPIAUCSL"
m2 = "M2SL"
claims = "ICSA"
nfp = "PAYEMS"
umcsent = "UMCSENT"
permits = "PERMIT"
ip = "INDPRO"
ism_pmi = "NAPM"
ism_nmi = "NMFBAI"
ust_10y = "DGS10"
ust_2y = "DGS2"

[llm]
# How hard the qualitative gate is to pass. "consistent" requires the verdict to
# agree with the model's own evidence (~80% pass here); "strict" additionally
# demands concrete, quantified evidence and rejects strategy language (~55%).
# The qualitative verdict is the only real gate on the book, and the one step where a
# small model returned a boolean contradicting its own evidence. One call per name, so
# a larger model is cheap. Extraction and templating stay on the default model.
# Measured mean latency for one verdict call: 8b 1.1s, nemotron-49b 6.8s, 70b 150s.
# The 70b is unusable here. Nemotron is more selective than the 8b at a workable speed.
# The active provider and its verdict model are selected from env vars:
#   OLLAMA_API_KEY + OLLAMA_VERDICT_MODEL (default deepseek-v4-pro:0813)
#   NVIDIA_API_KEY + verdict_model below
#   OPENAI_API_KEY + openai_model above
# Leave this empty to let the provider-specific env setting drive the verdict model.
verdict_model = ""
qualitative_bar = "consistent"
max_filing_chars = 12000
# Pack budget, allocated by where the numbers are. Measured: the 8-K earnings release
# carries ~22 quantitative expressions per 4k chars and ~10 more in the next 4k; Item 1
# Business has a median of 0 and MD&A 1. Must sum to max_filing_chars.
pack_business_chars = 3000
pack_mda_chars = 3000
pack_exhibit_chars = 6000
max_candidates = 16
# 0.2 by choice. Note the consequence: the short side passes qualitative ~20% of the
# time, so sampling noise moves names in and out of a 6-slot book between runs. Longs
# look stable only because they pass ~92%. Set 0.0 if you need run-to-run comparability.
temperature = 0.2
# Keep enough room for direction, durability and both evidence arrays. Earlier
# low limits truncated verdict JSON and silently lost otherwise valid ideas.
max_tokens = 3200
# Ideas are independent until the group pass. 1 keeps the old sequential behaviour;
# 4-6 cuts a 154-name run from ~33 min to under 10 without tripping provider limits.
idea_workers = 5
# Requests per second across the whole process. Pacing beats discovering the provider's
# limit through 429s: at 4 workers unpaced, one run logged 217 retries and 5 ideas lost
# their catalysts entirely. 0 disables pacing.
max_rps = 0

[asof]
ism_months_available = 3   # month URLs ismworld.org still serves; sets the backdate floor
ism_release_day = 4        # day of M+1 by which month M's PMI + Services are both out

[momentum]
lookbacks = [20, 60, 120]  # trading-day windows for the group momentum layer
up_threshold = 0.05        # 60d return above this reads as an up tape
down_threshold = -0.05     # below this reads as a down tape
min_bars = 30              # fewer bars than this and momentum is reported unknown

[earnings_buckets]
edges = [30, 60, 90]       # CALENDAR-day cuts to next earnings: 0-30, 31-60, 61-90

[fred_asof]
publication_lag_days = 45  # keyless CSV fallback only; the API path uses true ALFRED vintages

[themes]
# Global themes, detected in each company's OWN filings rather than pulled from
# news. That gives the ticker mapping for free, keeps every input dated so
# backdated runs still work, and avoids the fact that a headline is evidence a
# theme is already LATE. Patterns are a curated judgement call - edit freely.
# Leave `patterns` unset to use the built-in list in ptm/themes.py.
enabled = true
min_mentions = 2   # one passing reference is not exposure
max_per_name = 3   # a name claiming eight themes is claiming none

[expectations]
# What the market already expects: implied move from the options chain, consensus
# revisions, price reaction to past prints, and surprise history. None of the four
# has a point-in-time archive, so a backdated run refuses them all - the same rule
# as [estimates]. See ptm/ingest/expectations.py.
enabled = true
max_age_days = 2
workers = 8
thin_open_interest = 100   # below this the implied move is weakly measured
wide_spread_pct = 25.0     # as is above this
[edgar]
workers = 8   # concurrent SEC fetchers; all share one 8 req/s budget
# Cached XBRL extracts are keyed by ticker only, so on a live run they must expire or a
# freshly filed 10-Q stays invisible. Lower this during earnings season. 0 = never expire.
extract_max_age_days = 2
# OFF by default: guidance is non-GAAP/adjusted while XBRL trailing EPS is GAAP,
# so mixing them yields a meaningless growth rate and P/E. See docs/FEATURE-LIMITATIONS.md.
fetch_guidance = false
# Realized TTM growth above this is treated as distorted (one-off, tiny base) and
# clamped before it is extrapolated into forward EPS.
max_extrapolated_growth = 0.5

[estimates]
# Analyst consensus EPS (yfinance). The one input EDGAR structurally cannot supply:
# it makes eps1/eps2 independent, which is what the EG taxonomy needs. Never used on
# a backdated run - these carry no history, so using them then would be lookahead.
enabled = true
min_analysts = 2      # a two-analyst "consensus" is one opinion with a rounding error
max_age_days = 2      # matches the EDGAR extract window
# Exclude names with no consensus rather than falling back for them. Consensus EPS is
# adjusted and sits ~18% above GAAP trailing, so a fallback name's P/E uses a smaller
# denominator - it misprices that name AND drags the sector median everyone is judged
# against. Ignored on backdated runs, where the whole universe is on one basis.
require_consensus = true

[transcripts]
# Earnings call transcripts. Off until you supply a key: they are NOT in EDGAR (4% of
# 379 exhibits carry any transcript marker) and not reliably scrapeable (Motley Fool
# 429s, Investing.com 403s, Seeking Alpha forbids it in its terms), so this talks to a
# licensed API instead. Worth having: the 8-K release carries a median of 2 change-
# phrases against 9 level-phrases, and 37% carry none - which is the real ceiling on
# how often the verdict can size a claim.
enabled = false
provider = "fmp"              # fmp | finnhub
api_key_env = "TRANSCRIPT_API_KEY"
quarters = 2                  # how many recent calls to pull
max_chars = 6000              # per call, taken from the most change-dense passage
